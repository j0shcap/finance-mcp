[project]
name = "mcp-finance"
version = "0.4.2"
description = "An MCP server providing finance tools: a yfinance wrapper, computed analytics, and financial calculators."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Caponigro" }]
maintainers = [{ name = "Josh Caponigro" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "fastmcp",
  "finance",
  "yfinance",
  "stocks",
  "market-data",
  "financial-analytics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  # fastmcp is the API surface we build on (FastMCP, Client, ToolError,
  # client.transports), so cap below the next major: a 4.x release may break it.
  "fastmcp>=3.0,<4",
  "pydantic>=2.11.7", # floor required by fastmcp 3.x
  "pydantic-settings>=2.0",
  # yf.Search and Ticker.get_news(count=, tab=) landed in the 0.2.5x line along
  # with the current news `content` payload; 1.0 is the first stable release
  # carrying all three, so that is the floor the client code needs.
  "yfinance>=1.0",
]

[project.urls]
Homepage = "https://github.com/j0shcap/finance-mcp"
Repository = "https://github.com/j0shcap/finance-mcp"
Issues = "https://github.com/j0shcap/finance-mcp/issues"

[project.scripts]
mcp-finance = "finance_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pre-commit>=3.8",
  # Test-only oracles and tooling: independent implementations the calculators are
  # cross-checked against, the property-based driver, and a schema validator for the
  # e2e suite's check that every advertised tool schema is valid JSON Schema.
  "hypothesis>=6.100",
  "jsonschema>=4.0",
  "types-jsonschema",
  "numpy-financial>=1.0",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "numpy_financial.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: hits real Yahoo Finance endpoints; deselected by default, run with `make test-live`",
  "e2e: drives the built wheel over stdio in a subprocess; deselected by default, run with `make e2e`",
]
# `-m 'not live and not e2e'` keeps the default run (and therefore `make check`) offline,
# in-process and deterministic; `make test-live` and `make e2e` pass their own -m, which
# wins because -m takes a single value. --strict-markers turns a misspelled marker into an
# error rather than a test that silently never runs. tests/test_live_marker.py pins both.
addopts = "-m 'not live and not e2e' --strict-markers --cov=finance_mcp --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["finance_mcp"]
branch = true
omit = ["src/finance_mcp/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.bandit]
exclude_dirs = ["tests"]
