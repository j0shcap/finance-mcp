name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default GITHUB_TOKEN: the quality gate only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every version allowed by `requires-python` is gated here.
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Exact version, not a major tag: setup-uv stopped publishing floating
        # major tags after v7 (and that v7 tag no longer tracks the 7.x line).
        # Dependabot's github-actions ecosystem keeps this pin current.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Sets UV_PYTHON, which takes precedence over .python-version.
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run quality gate
        run: make check
      - name: Upload coverage to Codecov
        # One upload per commit: coverage is identical across the matrix, and a
        # single report keeps the codecov.yml project/patch gates unambiguous.
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: e2e over stdio (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A hung subprocess must not hold the runner for the default six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Same exact pin as the check job; also puts uvx, which one launcher needs, on PATH.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Build the wheel and drive it over stdio
        # Calculators and protocol only: the Yahoo-backed half runs nightly in live.yml.
        run: make e2e
