name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published.
# Auth is via PyPI Trusted Publishing (OIDC) — no API token/secret is stored.
# The version uploaded is `project.version` in pyproject.toml, so the `verify`
# job refuses to publish unless the release tag names that same version
# (PyPI versions are immutable — a mismatch cannot be undone).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and run quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Check release tag matches project.version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ] && [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match project.version '$version' (expected 'v$version'). Bump the version in pyproject.toml or retag." >&2
            exit 1
          fi
          echo "Publishing version $version from tag $RELEASE_TAG"
      - name: Install dependencies
        run: uv sync
      - name: Run quality gate
        run: make check

  pypi-publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        run: uv publish
