# Dependabot version updates — https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Python dependencies declared in pyproject.toml / pinned in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # These generate the model-facing contract (tool schemas, prompt text), so a bump can
      # change tests/snapshots/contract/. Grouped so one PR needs one `make snapshot`.
      contract:
        patterns:
          - "fastmcp*"
          - "mcp*"
          - "pydantic*"
      python-dev:
        dependency-type: "development"
  # The actions used by the CI and release workflows, pinned to major tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
